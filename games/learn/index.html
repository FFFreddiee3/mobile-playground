/* ================= 场景二：数一数 ================= */
const COUNT_THEMES = [
  { id: 'star',  itemEmoji: '⭐', itemName: '星星', unit: '颗', prompt: '数一数，天上有几颗星星呀？' },
  { id: 'apple', itemEmoji: '🍎', itemName: '苹果', unit: '个', prompt: '数一数，树上有几个苹果呀？' },
  { id: 'fish',  itemEmoji: '🐟', itemName: '小鱼', unit: '条', prompt: '数一数，水里有几条小鱼呀？' },
];
let countTheme = null;
let countTotal = 0;
let countTapped = 0;
let countLocked = false;
let countAnswered = false;
let countPrompt = '';
let countUnlockTimer = null;
/* 数完→出选项的过渡定时器：独立于 autoNextTimer，避免被音色面板的 clearAutoNext 误杀导致回合死锁 */
let countChoicesTimer = null;
function clearCountChoicesTimer() {
  if (countChoicesTimer) { clearTimeout(countChoicesTimer); countChoicesTimer = null; }
}

let mathMode = 'count';
let mathRecorded = false;
let subCrossed = false;
/* 划掉动画定时器：统一清理，防跨回合/跨场景泄漏 */
let crossTimer = null;
function clearCrossTimer() {
  if (crossTimer) { clearTimeout(crossTimer); crossTimer = null; }
}

/* 划掉动作与语音叙述同拍：按动作词在题干中的位置估算触发时刻（约 250ms/字，与气泡时长同源），
   到点后逐个划掉并配轻快短音（不复用答错音 buzz，避免语义混淆）；无语音设备回退 900ms。
   须在 countPrompt 赋值之后调用 */
function scheduleCross(items, actionWord) {
  const idx = countPrompt.indexOf(actionWord);
  const delay = (Speech.enabled && idx > 0) ? Math.min(400 + idx * 250, 5000) * 0.92 / Speech.rate : 900;
  const step = (i) => {
    if (countAnswered || i >= items.length) {
      /* 已作答则立即补齐剩余划掉，保证画面与讲解一致 */
      items.slice(i).forEach(s => s.classList.add('sub-item', 'taken'));
      subCrossed = true;
      return;
    }
    items[i].classList.add('sub-item', 'taken');
    Sfx.tone(520 - i * 30, 0.08, 'triangle', 0, 0.1);
    crossTimer = setTimeout(() => step(i + 1), 160);
  };
  crossTimer = setTimeout(() => step(0), delay);
}
/* 每回合由渲染函数设置的讲解与提示文案（count 模式除外） */
let mathSuccessText = '';
let mathWrongHint = '';

function startCountRound() {
  clearAutoNext();
  clearCountChoicesTimer();
  clearCrossTimer();
  countTapped = 0;
  countAnswered = false;
  mathRecorded = false;
  /* 开局短暂锁定，防止上一屏的连点误触新目标 */
  if (countUnlockTimer) clearTimeout(countUnlockTimer);
  countLocked = true;
  countUnlockTimer = setTimeout(() => { countLocked = false; }, 400);

  $('#count-choices').classList.add('hidden');
  $('#count-choices').innerHTML = '';
  $('#btn-count-next').classList.add('hidden');

  /* 按等级解锁玩法（一年级口算顺序）：
     L1 数数 → L2 +比多少 → L3 +加法≤10 → L4 +减法≤10
     → L5 +不进位加减(20 以内)与应用题 → L6 +进位加法(凑十)
     → L7 +退位减法(破十) → L8 应用题混合 20 以内 */
  const lv = Progress.get('math').lv;
  const MODE_POOLS = {
    1: ['count'],
    2: ['count', 'compare'],
    3: ['count', 'compare', 'add'],
    4: ['count', 'compare', 'add', 'sub'],
    5: ['compare', 'add', 'sub', 'plain20', 'story'],
    6: ['sub', 'plain20', 'carry', 'story'],
    7: ['plain20', 'carry', 'borrow', 'story'],
    8: ['carry', 'borrow', 'plain20', 'story'],
  };
  const modes = MODE_POOLS[lv] || MODE_POOLS[3];
  let nextMode;
  do { nextMode = pick(modes); } while (modes.length > 1 && nextMode === mathMode);
  mathMode = nextMode;

  if (mathMode === 'compare') renderCompareRound(lv);
  else if (mathMode === 'add') renderAddRound();
  else if (mathMode === 'sub') renderSubRound();
  else if (mathMode === 'plain20') renderPlain20Round();
  else if (mathMode === 'carry') renderCarryRound();
  else if (mathMode === 'borrow') renderBorrowRound();
  else if (mathMode === 'story') renderStoryRound(lv);
  else renderCountingRound(lv);
}

function renderCountingRound(lv) {
  let next;
  do { next = pick(COUNT_THEMES); } while (countTheme && next.id === countTheme.id);
  countTheme = next;
  const ranges = { 1: [3, 7], 2: [4, 9], 3: [5, 10] };
  const range = ranges[lv] || [5, 10]; /* L4/L5 沿用最高档 */
  countTotal = randInt(range[0], range[1]);
  $('#count-display').textContent = countTheme.prompt;

  const stage = $('#count-stage');
  stage.className = 'count-stage theme-' + countTheme.id;
  stage.innerHTML = '';

  /* 4 列 × 3 行网格中随机取格子，加抖动，避免重叠 */
  const cells = shuffle(Array.from({ length: 12 }, (_, i) => i)).slice(0, countTotal);
  cells.forEach(c => {
    const col = c % 4;
    const row = Math.floor(c / 4);
    const btn = document.createElement('button');
    btn.className = 'count-item';
    btn.textContent = countTheme.itemEmoji;
    btn.style.left = (col * 22 + 12 + Math.random() * 7) + '%';
    btn.style.top = (row * 26 + 16 + Math.random() * 8) + '%';
    btn.style.setProperty('--float-delay', (Math.random() * 1.6) + 's');
    btn.addEventListener('click', () => onCountTap(btn));
    stage.appendChild(btn);
  });

  countPrompt = countTheme.prompt + ' 点一点' + countTheme.itemName + '，数数看！';
  speak(countPrompt);
}

/* 比多少：两边物品，点多（或少）的一边 */
function renderCompareRound(lv) {
  countTheme = pick(COUNT_THEMES);
  const a = randInt(2, 6);
  let b;
  /* L3 及以上：范围到 9，且"多/少"随机问 */
  do { b = randInt(2, lv >= 3 ? 9 : 6); } while (b === a);
  const askMore = lv >= 3 ? Math.random() < 0.5 : true;
  const word = askMore ? '多' : '少';

  const stage = $('#count-stage');
  stage.className = 'count-stage compare-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  const q = '哪边的' + countTheme.itemName + word + '呀？';
  $('#count-display').textContent = q;

  [a, b].forEach((n, idx) => {
    const side = document.createElement('button');
    side.className = 'compare-side';
    side.style.setProperty('--in-delay', (idx * 0.12) + 's');
    side.setAttribute('aria-label', numWord(n) + countTheme.unit + countTheme.itemName);
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.textContent = countTheme.itemEmoji;
      side.appendChild(s);
    }
    side.addEventListener('click', () => onCompareChoice(side, n, a, b, askMore));
    stage.appendChild(side);
  });

  countPrompt = q + ' 点一点' + word + '的那一边！';
  speak(countPrompt);
}

function onCompareChoice(side, n, a, b, askMore) {
  if (countAnswered || countLocked) return;
  const target = askMore ? Math.max(a, b) : Math.min(a, b);
  const ok = n === target;
  if (!mathRecorded) { Progress.record('math', ok); mathRecorded = true; }
  if (ok) {
    countAnswered = true;
    side.classList.add('right');
    celebrate(side);
    /* 把两边数量摆出来对比，是"比多少"最核心的教学时刻 */
    const other = n === a ? b : a;
    const dur = speakSuccess('这边有' + numWord(n) + countTheme.unit + '，那边有' + numWord(other) + countTheme.unit + '，' + numCN20(n) + '比' + numCN20(other) + (askMore ? '多' : '少') + '！');
    $('#btn-count-next').classList.remove('hidden');
    autoNextTimer = setTimeout(startCountRound, dur + 2200);
  } else {
    side.classList.remove('shake');
    void side.offsetWidth;
    side.classList.add('shake');
    Sfx.buzz();
    speak(soothe() + '再数一数，哪边的' + countTheme.itemName + (askMore ? '多' : '少') + '呀？');
  }
}

/* 运算符/占位标签 */
function makeOp(t) {
  const op = document.createElement('span');
  op.className = 'add-op';
  op.textContent = t;
  return op;
}

/* 可点数实物（报数用 numCN20，受 subCrossed 门控） */
function makeCountable(el, counter) {
  el.addEventListener('click', () => {
    if (!subCrossed || el.classList.contains('taken') || el.classList.contains('counted')) return;
    el.classList.add('counted');
    counter.n++;
    Sfx.pop();
    speak(numCN20(counter.n), { noBubble: true });
  });
}

/* 小加法：实物点数 + 数字选择（具象→抽象） */
function renderAddRound() {
  countTheme = pick(COUNT_THEMES);
  const a = randInt(1, 5);
  const b = randInt(1, Math.min(5, 10 - a));
  countTotal = a + b;
  subCrossed = true; /* 无划掉环节，点数即刻可用 */

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  $('#count-display').textContent = a + ' + ' + b + ' = ?';

  const row = document.createElement('div');
  row.className = 'add-row';
  const counter = { n: 0 };
  const appendItems = (n) => {
    for (let i = 0; i < n; i++) {
      const s = document.createElement('button');
      s.className = 'add-item';
      s.textContent = countTheme.itemEmoji;
      makeCountable(s, counter);
      row.appendChild(s);
    }
  };
  appendItems(a);
  row.appendChild(makeOp('+'));
  appendItems(b);
  row.appendChild(makeOp('='));
  row.appendChild(makeOp('❓'));
  stage.appendChild(row);

  /* 数字选项直接给出，孩子可先点物品数一数 */
  renderNumChoices(countTotal, 1, 10);

  mathSuccessText = NUM_CN[a] + '加' + NUM_CN[b] + '等于' + NUM_CN[countTotal] + '！一共' + numWord(countTotal) + countTheme.unit + countTheme.itemName + '！';
  mathWrongHint = '点一点' + countTheme.itemName + '，一个一个数一数！';
  countPrompt = numWord(a) + countTheme.unit + countTheme.itemName + '，加' + numWord(b) + countTheme.unit + countTheme.itemName + '，一共有几' + countTheme.unit + '呀？可以点一点，数一数！';
  speak(countPrompt);
}

/* 数字选项面板（加/减/进位共用） */
function renderNumChoices(answer, min, max) {
  const panel = $('#count-choices');
  panel.innerHTML = '';
  panel.classList.remove('hidden');
  const options = new Set([answer]);
  while (options.size < 3) {
    options.add(randInt(Math.max(min, answer - 2), Math.min(max, answer + 2)));
  }
  shuffle(Array.from(options)).forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.style.setProperty('--in-delay', (i * 0.08) + 's');
    btn.textContent = v;
    btn.addEventListener('click', () => onCountChoice(v, btn));
    panel.appendChild(btn);
  });
}

/* 减法：先看到全部，再"拿走"几个（划掉），数剩下的 */
function renderSubRound() {
  countTheme = pick(COUNT_THEMES);
  const a = randInt(3, 10);
  const b = randInt(1, a - 1);
  countTotal = a - b;
  subCrossed = false;

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  $('#count-display').textContent = a + ' - ' + b + ' = ?';

  const row = document.createElement('div');
  row.className = 'add-row';
  const counter = { n: 0 };
  const items = [];
  for (let i = 0; i < a; i++) {
    const s = document.createElement('button');
    s.className = 'add-item sub-item';
    s.textContent = countTheme.itemEmoji;
    makeCountable(s, counter);
    row.appendChild(s);
    items.push(s);
  }
  stage.appendChild(row);

  renderNumChoices(countTotal, 1, 10);
  mathSuccessText = NUM_CN[a] + '减' + NUM_CN[b] + '等于' + NUM_CN[countTotal] + '！还剩' + numWord(countTotal) + countTheme.unit + countTheme.itemName + '！';
  mathWrongHint = '拿走的不算，数一数剩下的' + countTheme.itemName + '！';
  countPrompt = numWord(a) + countTheme.unit + countTheme.itemName + '，拿走' + numWord(b) + countTheme.unit + '，还剩几' + countTheme.unit + '呀？点一点，数数剩下的！';
  /* 语音念到"拿走"时才划掉，教学节拍一致 */
  scheduleCross(items.slice(a - b), '拿走');
  speak(countPrompt);
}

/* 构建十格阵：filled 个实物格，其余空格；返回 {el, cells} 供后续标记 */
function buildTenFrame(filled, emoji, counter) {
  const frame = document.createElement('div');
  frame.className = 'ten-frame';
  const cells = [];
  for (let i = 0; i < 10; i++) {
    if (i < filled) {
      const cell = document.createElement('button');
      cell.className = 'frame-cell filled add-item';
      cell.style.fontSize = '28px';
      cell.textContent = emoji;
      makeCountable(cell, counter);
      frame.appendChild(cell);
      cells.push(cell);
    } else {
      const cell = document.createElement('span');
      cell.className = 'frame-cell';
      frame.appendChild(cell);
    }
  }
  return { el: frame, cells };
}

/* 一组散放实物；返回元素数组 */
function buildLooseGroup(container, n, emoji, counter, extraClass) {
  const made = [];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('button');
    s.className = 'add-item' + (extraClass ? ' ' + extraClass : '');
    s.textContent = emoji;
    makeCountable(s, counter);
    container.appendChild(s);
    made.push(s);
  }
  return made;
}

/* 进位加法：十格阵 + 凑十法（一年级标准教法） */
function renderCarryRound() {
  countTheme = pick(COUNT_THEMES);
  const a = randInt(6, 9);
  const b = randInt(11 - a, 9);
  countTotal = a + b;
  const comp = 10 - a;  /* 凑十要借的个数 */
  const rest = b - comp;
  subCrossed = true;

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  $('#count-display').textContent = a + ' + ' + b + ' = ?';

  const counter = { n: 0 };
  const row = document.createElement('div');
  row.className = 'add-row';
  /* 左：十格阵放 a 个；右：b 个，前 comp 个高亮"借去凑十" */
  row.appendChild(buildTenFrame(a, countTheme.itemEmoji, counter).el);
  row.appendChild(makeOp('+'));
  const group = document.createElement('div');
  group.className = 'carry-group';
  buildLooseGroup(group, comp, countTheme.itemEmoji, counter, 'carry-borrow');
  buildLooseGroup(group, b - comp, countTheme.itemEmoji, counter);
  row.appendChild(group);
  stage.appendChild(row);

  renderNumChoices(countTotal, 10, 18);
  mathSuccessText = '先凑十：' + NUM_CN[a] + '加' + NUM_CN[comp] + '等于十，十再加' + NUM_CN[rest] + '，等于' + numCN20(countTotal) + '！';
  mathWrongHint = '先凑成十，十再加剩下的，是多少呀？';
  countPrompt = NUM_CN[a] + '加' + NUM_CN[b] + '等于几呀？先把亮亮的' + numWord(comp) + countTheme.unit + '放进格子里凑成十，再想一想！';
  speak(countPrompt);
}

/* 20 以内不进位加减：满十格阵 + 个位散放，"十不动、算个位"（位值教学） */
function renderPlain20Round() {
  countTheme = pick(COUNT_THEMES);
  const isAdd = Math.random() < 0.5;

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';

  const counter = { n: 0 };
  const row = document.createElement('div');
  row.className = 'add-row';
  row.appendChild(buildTenFrame(10, countTheme.itemEmoji, counter).el);
  const loose = document.createElement('div');
  loose.className = 'carry-group';

  if (isAdd) {
    subCrossed = true;
    const ones = randInt(0, 8);
    const a = 10 + ones;
    const b = randInt(1, 9 - ones);
    countTotal = a + b;
    $('#count-display').textContent = a + ' + ' + b + ' = ?';
    buildLooseGroup(loose, ones, countTheme.itemEmoji, counter);
    row.appendChild(loose);
    row.appendChild(makeOp('+'));
    const groupB = document.createElement('div');
    groupB.className = 'carry-group';
    buildLooseGroup(groupB, b, countTheme.itemEmoji, counter);
    row.appendChild(groupB);
    mathSuccessText = ones === 0
      ? ('十加' + NUM_CN[b] + '等于' + numCN20(countTotal) + '！')
      : ('个位' + NUM_CN[ones] + '加' + NUM_CN[b] + '等于' + NUM_CN[ones + b] + '，十不动，就是' + numCN20(countTotal) + '！');
    mathWrongHint = '格子里的十先放着不动，先算旁边的，算完再和十合起来！';
    countPrompt = numCN20(a) + '加' + NUM_CN[b] + '等于几呀？格子里的十先不动，先算旁边的，再想一想！';
  } else {
    subCrossed = false;
    const ones = randInt(1, 9);
    const a = 10 + ones;
    const b = randInt(1, ones);
    countTotal = a - b;
    $('#count-display').textContent = a + ' - ' + b + ' = ?';
    const looseItems = buildLooseGroup(loose, ones, countTheme.itemEmoji, counter, 'sub-item');
    row.appendChild(loose);
    mathSuccessText = '个位' + NUM_CN[ones] + '减' + NUM_CN[b] + '等于' + NUM_CN[ones - b] + '，十不动，还剩' + numCN20(countTotal) + '！';
    mathWrongHint = '格子里的十先放着不动，旁边的减完再和十合起来！';
    countPrompt = numCN20(a) + '减' + NUM_CN[b] + '等于几呀？旁边的够减，格子里的十不用动，看一看！';
    /* 个位够减：语音念到"旁边"时才从散放的个位里划掉 */
    scheduleCross(looseItems.slice(ones - b), '旁边');
  }
  stage.appendChild(row);
  renderNumChoices(countTotal, 10, 19);
  speak(countPrompt);
}

/* 退位减法：破十法——个位不够减，打开十来减（一年级标准教法） */
function renderBorrowRound() {
  countTheme = pick(COUNT_THEMES);
  const ones = randInt(1, 8);
  const a = 10 + ones;
  const b = randInt(ones + 1, 9); /* b > 个位 → 必须退位 */
  countTotal = a - b;
  const rest10 = 10 - b;
  subCrossed = false;

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  $('#count-display').textContent = a + ' - ' + b + ' = ?';

  const counter = { n: 0 };
  const row = document.createElement('div');
  row.className = 'add-row';
  const frame = buildTenFrame(10, countTheme.itemEmoji, counter);
  row.appendChild(frame.el);
  const loose = document.createElement('div');
  loose.className = 'carry-group';
  buildLooseGroup(loose, ones, countTheme.itemEmoji, counter);
  row.appendChild(loose);
  stage.appendChild(row);

  renderNumChoices(countTotal, 1, 10);
  mathSuccessText = '先破十：十减' + NUM_CN[b] + '等于' + NUM_CN[rest10] + '，' + NUM_CN[rest10] + '再加' + NUM_CN[ones] + '，等于' + NUM_CN[countTotal] + '！';
  mathWrongHint = '先用十去减，剩下的再加旁边的' + numWord(ones) + countTheme.unit + '！';
  countPrompt = numCN20(a) + '减' + NUM_CN[b] + '等于几呀？个位不够减，我们打开十来减，看一看！';
  /* 破十：语音念到"打开十"时才从十格阵里划掉 */
  scheduleCross(frame.cells.slice(10 - b), '打开十');
  speak(countPrompt);
}

/* 应用题：角色 + 物品的语音故事题（听算与数学语言理解） */
const STORY_CHARS = [
  { name: '小明', emoji: '👦' },
  { name: '小红', emoji: '👧' },
  { name: '小兔子', emoji: '🐰' },
  { name: '小熊', emoji: '🐻' },
  { name: '小猴子', emoji: '🐵' },
];
const STORY_OBJS = [
  { name: '糖果', emoji: '🍬', unit: '颗', gain: '妈妈又给了', lose: '吃掉了' },
  { name: '气球', emoji: '🎈', unit: '个', gain: '又买了', lose: '飞走了' },
  { name: '苹果', emoji: '🍎', unit: '个', gain: '又摘了', lose: '吃掉了' },
  { name: '饼干', emoji: '🍪', unit: '块', gain: '又拿了', lose: '吃掉了' },
  { name: '小花', emoji: '🌸', unit: '朵', gain: '又采了', lose: '送给了好朋友' },
  { name: '贴纸', emoji: '⭐', unit: '张', gain: '又得到了', lose: '送给了好朋友' },
];

function renderStoryRound(lv) {
  countTheme = pick(COUNT_THEMES); /* 仅用于舞台底色 */
  const ch = pick(STORY_CHARS);
  const obj = pick(STORY_OBJS);
  const isAdd = Math.random() < 0.5;
  const hard = lv >= 8; /* L8 用 20 以内（可进/退位），其余 ≤10 */
  let a, b;
  if (isAdd) {
    if (hard) { a = randInt(5, 12); b = randInt(2, Math.min(8, 20 - a)); }
    else { a = randInt(2, 6); b = randInt(1, Math.min(4, 10 - a)); }
    countTotal = a + b;
  } else {
    if (hard) { a = randInt(11, 15); b = randInt(2, 9); }
    else { a = randInt(3, 9); b = randInt(1, a - 1); }
    countTotal = a - b;
  }

  const stage = $('#count-stage');
  stage.className = 'count-stage add-mode theme-' + countTheme.id;
  stage.innerHTML = '';
  $('#count-display').textContent = a + (isAdd ? ' + ' : ' - ') + b + ' = ?';

  const figure = document.createElement('div');
  figure.className = 'judge-figure';
  figure.textContent = ch.emoji;
  stage.appendChild(figure);

  const counter = { n: 0 };
  const row = document.createElement('div');
  row.className = 'add-row';
  let storySubItems = null;
  if (isAdd) {
    subCrossed = true;
    buildLooseGroup(row, a, obj.emoji, counter);
    row.appendChild(makeOp('+'));
    buildLooseGroup(row, b, obj.emoji, counter);
  } else {
    subCrossed = false;
    storySubItems = buildLooseGroup(row, a, obj.emoji, counter, 'sub-item');
  }
  stage.appendChild(row);

  const story = isAdd
    ? (ch.name + '有' + numWord(a) + obj.unit + obj.name + '，' + obj.gain + numWord(b) + obj.unit + '，现在一共有几' + obj.unit + '？')
    : (ch.name + '有' + numWord(a) + obj.unit + obj.name + '，' + obj.lose + numWord(b) + obj.unit + '，还剩几' + obj.unit + '？');

  renderNumChoices(countTotal, 1, hard ? 20 : 10);
  mathSuccessText = isAdd
    ? (ch.name + '现在有' + numWord(countTotal) + obj.unit + obj.name + '！' + numCN20(a) + '加' + numCN20(b) + '等于' + numCN20(countTotal) + '！')
    : ('还剩' + numWord(countTotal) + obj.unit + obj.name + '！' + numCN20(a) + '减' + numCN20(b) + '等于' + numCN20(countTotal) + '！');
  mathWrongHint = (isAdd ? '变多了要用加法' : '变少了要用减法') + '！可以点一点，数一数！';
  countPrompt = '听好啦！' + story;
  /* 故事讲到"吃掉了/飞走了"时才划掉 */
  if (!isAdd) scheduleCross(storySubItems.slice(a - b), obj.lose);
  speak(countPrompt);
}

function onCountTap(btn) {
  if (countLocked || btn.classList.contains('counted')) return;
  btn.classList.add('counted');
  countTapped++;
  const badge = document.createElement('span');
  badge.className = 'count-badge';
  badge.textContent = countTapped;
  btn.appendChild(badge);
  Sfx.pop();
  speak(NUM_CN[countTapped], { noBubble: true });
  $('#count-display').textContent = '数到 ' + countTapped + ' 啦！';
  if (countTapped === countTotal) {
    countLocked = true;
    /* 数完集体欢呼跳 */
    document.querySelectorAll('.count-item').forEach((el, i) => {
      setTimeout(() => el.classList.add('cheer'), i * 90);
    });
    /* 独立定时器：由 showScreen/startCountRound 清理，音色面板不干预 */
    countChoicesTimer = setTimeout(showCountChoices, 1000);
  }
}

function showCountChoices() {
  /* 防御：仅在数一数场景处于数完待答状态时展示 */
  if (!countLocked || countAnswered) return;
  if (!document.getElementById('screen-counting').classList.contains('active')) return;
  /* 音色/家长面板打开时顺延，关闭后再弹出选项，避免语音与试听打架 */
  if (!$('#voice-panel').classList.contains('hidden') || !$('#parent-panel').classList.contains('hidden')) {
    countChoicesTimer = setTimeout(showCountChoices, 600);
    return;
  }
  const question = '一共有几' + countTheme.unit + countTheme.itemName + '呢？';
  $('#count-display').textContent = question;
  renderNumChoices(countTotal, 1, 10);
  /* 选项已就位、场上无可误触目标：解锁，让 onCountChoice 统一用锁守卫 */
  countLocked = false;
  countPrompt = question + ' 选一选下面的数字！';
  speak(countPrompt);
}

function onCountChoice(value, btn) {
  /* 锁守卫：加法模式开局 400ms 防上一屏连点误触（数数模式在 showCountChoices 已解锁） */
  if (countAnswered || countLocked) return;
  if (!mathRecorded) { Progress.record('math', value === countTotal); mathRecorded = true; }
  if (value === countTotal) {
    countAnswered = true;
    btn.classList.add('right');
    celebrate(btn);
    /* 等式揭晓：3 + 2 = ? → 3 + 2 = 5（听觉与视觉同步呈现完整等式） */
    const cd = $('#count-display');
    cd.textContent = cd.textContent.replace('?', String(countTotal));
    /* 讲解文案由各模式的渲染函数在出题时写好 */
    const successText = mathMode === 'count'
      ? ('一共有' + numWord(countTotal) + countTheme.unit + countTheme.itemName + '！你数得真好！')
      : mathSuccessText;
    const dur = speakSuccess(successText);
    $('#btn-count-next').classList.remove('hidden');
    /* 按播报时长动态排布自动换题 */
    autoNextTimer = setTimeout(startCountRound, dur + 2200);
  } else {
    btn.classList.add('wrong');
    Sfx.buzz();
    /* 提示语按模式分流（数数模式才有数字角标） */
    speak(soothe() + (mathMode === 'count'
      ? ('看看' + countTheme.itemName + '上的小数字，再数一数！')
      : mathWrongHint));
    setTimeout(() => btn.classList.remove('wrong'), 600);
  }
}

function enterCounting() {
  showScreen('counting');
  sceneGreeting = '欢迎来到数学岛！';
  startCountRound();
}

/* ================= 场景三：听指令 ================= */

let cmdLocked = false;
let cmdPrompt = '';
let lastCmdType = null;
let lastJudgeText = '';
let cmdUnlockTimer = null;
let cmdRecorded = false;

function setCmdText(text) { $('#cmd-text').textContent = text; }

function cmdCorrect(el, successText) {
  if (cmdLocked) return;
  cmdLocked = true;
  if (!cmdRecorded) { Progress.record('listen', true); cmdRecorded = true; }
  el.classList.add('right');
  celebrate(el);
  const dur = speakSuccess(successText);
  $('#btn-cmd-next').classList.remove('hidden');
  /* 按播报时长动态排布自动换题 */
  autoNextTimer = setTimeout(startCommandRound, dur + 2200);
}

function cmdWrong(el, msg) {
  if (cmdLocked) return;
  if (!cmdRecorded) { Progress.record('listen', false); cmdRecorded = true; }
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  Sfx.buzz();
  speak(msg);
}

function renderCmdItems(items) {
  const stage = $('#cmd-stage');
  stage.innerHTML = '';
  items.forEach((it, i) => {
    const btn = document.createElement('button');
    btn.className = 'cmd-item';
    btn.style.setProperty('--in-delay', (i * 0.07) + 's');
    const emoji = document.createElement('span');
    emoji.className = 'cmd-emoji' + (it.sizeClass ? ' ' + it.sizeClass : '');
    emoji.textContent = it.emoji;
    btn.appendChild(emoji);
    if (it.label) {
      const label = document.createElement('span');
      label.className = 'cmd-label';
      label.textContent = it.label;
      btn.appendChild(label);
    }
    btn.addEventListener('click', () => it.onClick(btn));
    stage.appendChild(btn);
  });
}

/* 抽 4 个颜色互不相同的物品 */
function distinctColorSample(n) {
  const result = [];
  const usedColors = new Set();
  for (const item of shuffle(COLOR_ITEMS)) {
    if (usedColors.has(item.color)) continue;
    usedColors.add(item.color);
    result.push(item);
    if (result.length === n) break;
  }
  return result;
}

function roundColor() {
  const items = distinctColorSample(4);
  const target = pick(items);
  cmdPrompt = '请点一点，' + target.name + '！';
  setCmdText('请点一点：' + target.name);
  renderCmdItems(items.map(it => ({
    emoji: it.emoji,
    label: it.name,
    onClick: (btn) => {
      Sfx.pop();
      if (it === target) cmdCorrect(btn, '你找到了' + target.name + '！');
      else cmdWrong(btn, '这是' + it.name + '哦，再找一找' + target.name + '！');
    },
  })));
  speak(cmdPrompt);
}

function roundSound() {
  const items = shuffle(SOUND_ANIMALS).slice(0, 4);
  const target = pick(items);
  cmdPrompt = '听好啦！哪个小动物会' + target.sound + '叫呀？';
  setCmdText('谁会 ' + target.sound + ' 叫呀？');
  renderCmdItems(items.map(it => ({
    emoji: it.emoji,
    label: it.name,
    onClick: (btn) => {
      Sfx.pop();
      if (it === target) cmdCorrect(btn, target.name + '会' + target.sound + '叫，' + target.sound + '！');
      else cmdWrong(btn, it.name + '会' + it.sound + '叫。再想一想，谁会' + target.sound + '叫呢？');
    },
  })));
  speak(cmdPrompt);
}

function roundSize() {
  const item = pick(SIZE_ITEMS);
  const wantBig = Math.random() < 0.5;
  const word = wantBig ? '大大的' : '小小的';
  const otherWord = wantBig ? '小小的' : '大大的';
  cmdPrompt = '请点一点，' + word + item.name + '！';
  setCmdText('请点一点：' + word + item.name);
  const makeItem = (isBig) => ({
    emoji: item.emoji,
    sizeClass: isBig ? 'big' : 'small',
    label: isBig ? '大' : '小',
    onClick: (btn) => {
      Sfx.pop();
      if (isBig === wantBig) cmdCorrect(btn, '这就是' + word + item.name + '！');
      else cmdWrong(btn, '这个是' + otherWord + item.name + '哦，再试一试！');
    },
  });
  renderCmdItems(shuffle([makeItem(true), makeItem(false)]));
  speak(cmdPrompt);
}

function roundJudge() {
  let q;
  do { q = pick(JUDGE_QUESTIONS); } while (q.text === lastJudgeText && JUDGE_QUESTIONS.length > 1);
  lastJudgeText = q.text;
  cmdPrompt = '听好啦！' + q.text + '，对不对呀？';
  setCmdText(q.text + '，对不对？');

  const stage = $('#cmd-stage');
  stage.innerHTML = '';
  const figure = document.createElement('div');
  figure.className = 'judge-figure';
  figure.textContent = q.emoji;
  stage.appendChild(figure);

  const explain = q.answer ? '这句话是对的！' : '这句话不对哦！';
  [{ yes: true, cls: 'judge-yes', icon: '✔️', label: '对' },
   { yes: false, cls: 'judge-no', icon: '✖️', label: '不对' }].forEach((cfg, i) => {
    const btn = document.createElement('button');
    btn.className = 'judge-btn ' + cfg.cls;
    btn.style.setProperty('--in-delay', (0.1 + i * 0.08) + 's');
    btn.innerHTML = '<span class="judge-icon">' + cfg.icon + '</span><span>' + cfg.label + '</span>';
    btn.addEventListener('click', () => {
      Sfx.pop();
      if (cfg.yes === q.answer) {
        btn.classList.add('right');
        cmdCorrect(btn, q.text + '，' + explain);
      } else {
        cmdWrong(btn, soothe() + q.text + '，是这样吗？');
      }
    });
    stage.appendChild(btn);
  });
  speak(cmdPrompt);
}

function startCommandRound() {
  clearAutoNext();
  cmdRecorded = false;
  /* 换题后短暂锁定，防止庆祝时的连点误触新题 */
  if (cmdUnlockTimer) clearTimeout(cmdUnlockTimer);
  cmdLocked = true;
  cmdUnlockTimer = setTimeout(() => { cmdLocked = false; }, 400);
  $('#btn-cmd-next').classList.add('hidden');
  const types = ['color', 'sound', 'size', 'judge'];
  let type;
  do { type = pick(types); } while (type === lastCmdType);
  lastCmdType = type;
  ({ color: roundColor, sound: roundSound, size: roundSize, judge: roundJudge })[type]();
}

let litTarget = null;
let litLocked = false;
let litRecorded = false;
let litPrompt = '';
let litBubbleText = '';
let litUnlockTimer = null;

/* 识字题干播报：图→字模式的气泡不能露出答案字形，用拼音版气泡替代 */
function speakLit() {
  if (litBubbleText) {
    showBubble(litBubbleText);
    speak(litPrompt, { noBubble: true });
  } else {
    speak(litPrompt);
  }
}

function startLitRound() {
  clearAutoNext();
  litRecorded = false;
  if (litUnlockTimer) clearTimeout(litUnlockTimer);
  litLocked = true;
  litUnlockTimer = setTimeout(() => { litLocked = false; }, 400);
  $('#btn-lit-next').classList.add('hidden');

  const lv = Progress.get('literacy').lv;
  /* 70% 当前层新字，30% 复习更低层 */
  let pool = LITERACY_WORDS.filter(w => w.lv === lv);
  if (lv > 1 && Math.random() < 0.3) pool = LITERACY_WORDS.filter(w => w.lv < lv);
  let target;
  do { target = pick(pool); } while (litTarget && target.text === litTarget.text && pool.length > 1);
  litTarget = target;

  /* 干扰项：字与图都不能重复 */
  const distractors = [];
  for (const w of shuffle(LITERACY_WORDS)) {
    if (w.text === target.text || w.emoji === target.emoji) continue;
    if (distractors.some(d => d.emoji === w.emoji || d.text === w.text)) continue;
    distractors.push(w);
    if (distractors.length === 3) break;
  }
  const mode = lv === 1 ? 'char2pic' : (lv === 2 ? 'pic2char' : (Math.random() < 0.5 ? 'char2pic' : 'pic2char'));
  const options = shuffle([target].concat(distractors));

  const stage = $('#lit-stage');
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'lit-card';
  if (mode === 'char2pic') {
    card.innerHTML = '<span class="lit-pinyin">' + target.pinyin + '</span><span class="lit-char">' + target.text + '</span>';
  } else {
    card.innerHTML = '<span class="lit-figure">' + target.emoji + '</span>';
  }
  stage.appendChild(card);

  options.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'cmd-item';
    btn.style.setProperty('--in-delay', (i * 0.07) + 's');
    const span = document.createElement('span');
    span.className = 'cmd-emoji' + (mode === 'char2pic' ? '' : ' lit-choice');
    span.textContent = mode === 'char2pic' ? w.emoji : w.text;
    btn.appendChild(span);
    btn.setAttribute('aria-label', w.text);
    btn.addEventListener('click', () => onLitAnswer(w, btn, mode));
    stage.appendChild(btn);
  });

  if (mode === 'char2pic') {
    $('#lit-text').textContent = '这个字念：' + target.text;
    litBubbleText = '';
    litPrompt = '这个字念，' + target.text + '。找一找，哪个是' + target.text + '呀？';
  } else {
    /* 图→字：题面不能露出答案字形；无语音设备除外（否则读音无从传达） */
    const shown = Speech.enabled ? target.pinyin : target.text;
    $('#lit-text').textContent = '哪个字念 ' + shown + '？';
    litBubbleText = '哪个字念 ' + shown + '？';
    litPrompt = '找一找，哪个字念，' + target.text + '？';
  }
  speakLit();
}

function onLitAnswer(w, btn, mode) {
  if (litLocked) return;
  Sfx.pop();
  const ok = w.text === litTarget.text;
  if (!litRecorded) { Progress.record('literacy', ok); litRecorded = true; }
  if (ok) {
    litLocked = true;
    btn.classList.add('right');
    celebrate(btn);
    const dur = speakSuccess(litTarget.text + '，' + litTarget.text + '！你认识这个字啦！');
    $('#btn-lit-next').classList.remove('hidden');
    autoNextTimer = setTimeout(startLitRound, dur + 2200);
  } else {
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    Sfx.buzz();
    speak(mode === 'char2pic'
      ? ('这是' + w.text + '哦，再找一找' + litTarget.text + '？')
      : ('再看一看，' + litTarget.text + ' 这个字在哪里呢？'));
  }
}

/* 找规律：AB / AAB·ABB / ABC */
function renderPatternRound(lv) {
  const pool = shuffle(pick(PATTERN_POOLS));
  const A = pool[0], B = pool[1], C = pool[2];
  let unit;
  if (lv === 1) unit = [A, B];
  else if (lv === 2) unit = Math.random() < 0.5 ? [A, A, B] : [A, B, B];
  else unit = [A, B, C];
  const seqLen = 5;
  const seq = Array.from({ length: seqLen }, (_, i) => unit[i % unit.length]);
  const answer = unit[seqLen % unit.length];
  const options = shuffle([answer].concat(shuffle(pool.filter(x => x !== answer)).slice(0, 2)));

  const stage = $('#logic-stage');
  stage.innerHTML = '';
  const rowEl = document.createElement('div');
  rowEl.className = 'pattern-row';
  seq.forEach(s => {
    const slot = document.createElement('span');
    slot.className = 'pattern-slot';
    slot.textContent = s;
    rowEl.appendChild(slot);
  });
  const qSlot = document.createElement('span');
  qSlot.className = 'pattern-slot pattern-q';
  qSlot.textContent = '？';
  rowEl.appendChild(qSlot);
  stage.appendChild(rowEl);

  options.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'cmd-item';
    btn.style.setProperty('--in-delay', (i * 0.07) + 's');
    const span = document.createElement('span');
    span.className = 'cmd-emoji';
    span.textContent = s;
    btn.appendChild(span);
    btn.addEventListener('click', () => {
      if (logicLocked) return;
      Sfx.pop();
      const ok = s === answer;
      if (!logicRecorded) { Progress.record('logic', ok); logicRecorded = true; }
      if (ok) {
        qSlot.textContent = answer;
        qSlot.classList.remove('pattern-q');
        qSlot.classList.add('reveal'); /* 谜底跳进空格 */
        logicCorrect(btn, '就是它！它们排队是有规律的！');
      } else {
        logicWrong(btn, soothe() + '看一看它们排队的顺序，问号那里该是谁呀？');
      }
    });
    stage.appendChild(btn);
  });

  $('#logic-text').textContent = '接下来该是谁？';
  logicPrompt = '看一看它们排队的规律，问号那里该是谁呀？';
  speak(logicPrompt);
}

/* 找不同：三个同类 + 一个不同类 */
function renderOddOneRound(lv) {
  let catA, catB;
  if (lv >= 3 && Math.random() < 0.5) {
    /* 易混组合：多数是水果，混入一个别的吃的（反向会有歧义，不出） */
    catA = ODD_CATEGORIES.find(c => c.name === '水果');
    catB = ODD_CATEGORIES.find(c => c.name === '吃的');
  } else {
    let two;
    do { two = shuffle(ODD_CATEGORIES).slice(0, 2); }
    while (two[0].name === '吃的' && two[1].name === '水果');
    catA = two[0];
    catB = two[1];
  }
  const majors = shuffle(catA.items).slice(0, 3);
  const odd = pick(catB.items.filter(x => !majors.includes(x)));
  const items = shuffle(majors.concat([odd]));

  const stage = $('#logic-stage');
  stage.innerHTML = '';
  items.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'cmd-item';
    btn.style.setProperty('--in-delay', (i * 0.07) + 's');
    const span = document.createElement('span');
    span.className = 'cmd-emoji';
    span.textContent = s;
    btn.appendChild(span);
    btn.addEventListener('click', () => {
      if (logicLocked) return;
      Sfx.pop();
      const ok = s === odd;
      if (!logicRecorded) { Progress.record('logic', ok); logicRecorded = true; }
      if (ok) {
        const isFruitMix = catA.name === '水果' && catB.name === '吃的';
        logicCorrect(btn, isFruitMix
          ? '其他都是水果，只有它不是水果！'
          : ('其他都是' + catA.name + '，只有它是' + catB.name + '！'));
      } else {
        logicWrong(btn, soothe() + '哪一个和其他的不是一类呢？');
      }
    });
    stage.appendChild(btn);
  });

  $('#logic-text').textContent = '哪个和别的不一样？';
  logicPrompt = '找一找，哪一个和其他的不是一类呀？';
  speak(logicPrompt);
}

function enterLogic() {
  showScreen('logic');
  sceneGreeting = '欢迎来到魔法逻辑！';
  startLogicRound();
}

/* ================= 音色选择面板（家长用） ================= */
function renderVoiceList() {
  const list = $('#voice-list');
  list.innerHTML = '';
  if (!Speech.enabled || !Speech.zhVoices.length) {
    const empty = document.createElement('div');
    empty.className = 'voice-empty';
    empty.textContent = Speech.enabled
      ? '没有找到中文语音。在系统设置里下载中文语音后，这里就能选啦。'
      : '这台设备不支持语音朗读，游戏会用文字气泡代替。';
    list.appendChild(empty);
    return;
  }
  Speech.zhVoices.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = 'voice-item' + (Speech.voice && Speech.voice.voiceURI === v.voiceURI ? ' active' : '');
    const name = document.createElement('span');
    name.textContent = v.name;
    if (i === 0) {
      /* 评分最高的音色标"推荐" */
      const rec = document.createElement('span');
      rec.className = 'voice-rec';
      rec.textContent = '推荐';
      name.appendChild(rec);
    }
    const lang = document.createElement('span');
    lang.className = 'voice-lang';
    lang.textContent = v.lang + '\n' + (v.localService ? '设备语音' : '联网语音');
    btn.setAttribute('aria-pressed', String(Speech.voice?.voiceURI === v.voiceURI));
    btn.appendChild(name);
    btn.appendChild(lang);
    btn.addEventListener('click', () => {
      Speech.use(v.voiceURI || v.name);
      renderVoiceList();
      previewVoice();
    });
    list.appendChild(btn);
  });
  /* 当前选中项滚入可视区（长列表时不至于看不到勾选在哪） */
  const act = list.querySelector('.voice-item.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
}
function updateVoiceRate() {
  $('#voice-rate').value = String(Speech.rate);
  $('#voice-rate-value').textContent = Speech.rate.toFixed(2) + '×';
  document.querySelectorAll('[data-voice-rate]').forEach(button => {
    button.setAttribute('aria-pressed', String(Number(button.dataset.voiceRate) === Speech.rate));
  });
}
function previewVoice() {
  speak('你好呀，小朋友。今天我们一起认识小动物，再来数一数，树上有几个苹果吧！', { noBubble: true, preview: true });
}
function openVoicePanel() {
  /* 暂停自动换题并停掉当前播报，避免面板打开期间游戏在遮罩后换题、掐断试听 */
  clearAutoNext();
  stopSpeak();
  updateVoiceRate();
  voiceStatus('选好声音后，点击试听。');
  $('#voice-overlay').classList.remove('hidden');
  $('#voice-panel').classList.remove('hidden');
  renderVoiceList();
}
function closeVoicePanel() {
  $('#voice-overlay').classList.add('hidden');
  $('#voice-panel').classList.add('hidden');
  stopSpeak();
}

/* ================= 发呆引导：22 秒无操作时温柔复述当前题目（每次触摸后最多一次） ================= */
let idleTimer = null;
let idleNudged = false;

function idleRepeat() {
  const active = document.querySelector('.screen.active');
  if (!active) return false;
  if (active.id === 'screen-counting' && countPrompt) { speak('小朋友，' + countPrompt); return true; }
  if (active.id === 'screen-commands' && cmdPrompt) { speak('小朋友，' + cmdPrompt); return true; }
  if (active.id === 'screen-literacy' && litPrompt) { speakLit(); return true; }
  if (active.id === 'screen-logic' && logicPrompt) { speak('小朋友，' + logicPrompt); return true; }
  if (active.id === 'screen-animals' && seekTarget) { speak('小朋友，请找一找，' + seekTarget.name + '在哪里呀？'); return true; }
  return false;
}

function armIdleNudge() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (idleNudged) return;
    if (document.visibilityState !== 'visible') return;
    if (!$('#voice-panel').classList.contains('hidden') || !$('#parent-panel').classList.contains('hidden')) return;
    if (idleRepeat()) idleNudged = true;
  }, 22000);
}

/* ================= 初始化与事件绑定 ================= */
function init() {
  loadStars();
  Progress.load();
  Speech.init();
  if (document.body.dataset.collection === 'true') $('#collection-return').classList.remove('hidden');
  $('#voice-rate').addEventListener('input', e => { Speech.setRate(e.target.value); updateVoiceRate(); });
  document.querySelectorAll('[data-voice-rate]').forEach(button => button.addEventListener('click', () => {
    Speech.setRate(button.dataset.voiceRate); updateVoiceRate(); previewVoice();
  }));
  $('#btn-voice-preview').addEventListener('click', previewVoice);
  $('#btn-voice-stop').addEventListener('click', () => { stopSpeak(); voiceStatus('已停止试听'); });
  window.addEventListener('pagehide', stopSpeak);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeak(); });

  /* 首次触摸解锁音频上下文（浏览器自动播放策略）+ 点击处星尘 + 重置发呆提醒 */
  document.addEventListener('pointerdown', (e) => {
    Sfx.ensure();
    if (e.isPrimary) tapBurst(e.clientX, e.clientY);
    idleNudged = false;
    armIdleNudge();
  });

  scheduleWiggle();

  document.querySelectorAll('.menu-card').forEach(card => {
    card.addEventListener('click', () => {
      Sfx.ding();
      const scene = card.dataset.scene;
      if (scene === 'animals') enterAnimals();
      else if (scene === 'counting') enterCounting();
      else if (scene === 'commands') enterCommands();
      else if (scene === 'literacy') enterLiteracy();
      else if (scene === 'logic') enterLogic();
    });
  });

  $('#btn-home').addEventListener('click', () => {
    Sfx.pop();
    showScreen('home');
  });

  /* 音色面板 */
  $('#btn-voice').addEventListener('click', () => { Sfx.pop(); openVoicePanel(); });
  $('#btn-voice-close').addEventListener('click', () => { Sfx.pop(); closeVoicePanel(); });
  $('#voice-overlay').addEventListener('click', closeVoicePanel);

  /* 勋章墙与家长看板 */
  $('#btn-medals').addEventListener('click', () => { Sfx.ding(); enterMedals(); });
  $('#btn-parent').addEventListener('click', () => { Sfx.pop(); openParentPanel(); });
  $('#btn-parent-close').addEventListener('click', () => { Sfx.pop(); closeParentPanel(); });
  $('#parent-overlay').addEventListener('click', closeParentPanel);

  /* 清空记录和星星：双击确认，防误触；文案先讲清后果 */
  $('#btn-parent-reset').addEventListener('click', () => {
    const btn = $('#btn-parent-reset');
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = '再按一次，记录和星星都会清空';
      resetTimer = setTimeout(disarmReset, 3000);
    } else {
      if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
      resetArmed = false;
      try {
        localStorage.removeItem('kidgame_progress');
        localStorage.removeItem('kidgame_stars');
        localStorage.removeItem('kidgame_meta');
      } catch (e) { /* 忽略 */ }
      correctStreak = 0;
      loadStars();
      Progress.load();
      renderParentList();
      btn.textContent = '已清空 ✓';
      setTimeout(() => { btn.textContent = '清空记录和星星'; }, 2000);
    }
  });

  /* 识字乐园 */
  $('#btn-lit-repeat').addEventListener('click', () => speakLit());
  $('#btn-lit-next').addEventListener('click', () => {
    Sfx.pop();
    startLitRound();
  });

  /* 魔法逻辑 */
  $('#btn-logic-repeat').addEventListener('click', () => speak(logicPrompt));
  $('#btn-logic-next').addEventListener('click', () => {
    Sfx.pop();
    startLogicRound();
  });

  /* 题干大卡本身可点重听：对不识字的孩子比小喇叭按钮更直觉 */
  $('#count-display').addEventListener('click', () => { if (countPrompt) speak(countPrompt); });
  $('#cmd-text').addEventListener('click', () => { if (cmdPrompt) speak(cmdPrompt); });
  $('#lit-text').addEventListener('click', () => { if (litPrompt) speakLit(); });
  $('#logic-text').addEventListener('click', () => { if (logicPrompt) speak(logicPrompt); });
  ['#count-display', '#cmd-text', '#lit-text', '#logic-text'].forEach(sel => {
    $(sel).setAttribute('role', 'button');
    $(sel).setAttribute('aria-label', '再听一遍题目');
  });

  /* 动物乐园 */
  $('#btn-seek').addEventListener('click', startSeek);
  $('#btn-seek-repeat').addEventListener('click', () => {
    if (seekTarget) speak('请找一找，' + seekTarget.name + '在哪里呀？');
  });
  $('#btn-seek-cancel').addEventListener('click', () => {
    Sfx.pop();
    endSeek();
    speak('好的，我们随便看看小动物吧！');
  });

  /* 数一数 */
  $('#btn-count-repeat').addEventListener('click', () => speak(countPrompt));
  $('#btn-count-next').addEventListener('click', () => {
    Sfx.pop();
    startCountRound();
  });

  /* 听指令 */
  $('#btn-cmd-repeat').addEventListener('click', () => speak(cmdPrompt));
  $('#btn-cmd-next').addEventListener('click', () => {
    Sfx.pop();
    startCommandRound();
  });
}

init();
</script>
